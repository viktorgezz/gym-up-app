# Checks every push and pull request; publishes the default branch to GitHub Pages.
name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the deploy job gets Pages rights.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the check still running for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Exactly the versions from package-lock.json.
      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # The site lives at https://<user>.github.io/<repo>/, so assets, the manifest and the
      # service worker scope need that path. A <user>.github.io repository is served from /.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    # Only the default branch is published; other branches and PRs are just checked.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Never cut a deployment in half: a newer one waits for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
